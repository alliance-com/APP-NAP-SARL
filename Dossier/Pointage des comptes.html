<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout : barre de compte + onglets ; l'onglet « Synthèse » répond en un écran à « tout est pointé ? » */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --surface-2:#e8eeeb; --ink:#13201c; --muted:#58695f; --line:#d2dcd7;
  --accent:#0e5a4a; --accent-ink:#ffffff; --accent-soft:#d6ebe4;
  --ok:#1b7443; --ok-bg:#dcf0e3; --warn:#8f5c00; --warn-bg:#f9ecd0; --bad:#b0251c; --bad-bg:#fae0dc; --idle:#475879; --idle-bg:#e2e7f1;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#151d1a; --surface-2:#1c2723; --ink:#e3ebe7; --muted:#92a39b; --line:#2a3732;
  --accent:#4fbea1; --accent-ink:#06211a; --accent-soft:#183a31;
  --ok:#6fd49b; --ok-bg:#163726; --warn:#efb84e; --warn-bg:#3a2b0f; --bad:#ff8b80; --bad-bg:#3d1815; --idle:#a3b5da; --idle-bg:#1f2638;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#151d1a; --surface-2:#1c2723; --ink:#e3ebe7; --muted:#92a39b; --line:#2a3732;
  --accent:#4fbea1; --accent-ink:#06211a; --accent-soft:#183a31;
  --ok:#6fd49b; --ok-bg:#163726; --warn:#efb84e; --warn-bg:#3a2b0f; --bad:#ff8b80; --bad-bg:#3d1815; --idle:#a3b5da; --idle-bg:#1f2638;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.15rem}
h3{font-size:.98rem}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0}
.muted{color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* barre haute */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:1.4rem}
.accounts{display:flex;flex-wrap:wrap;gap:6px}
.acct{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:500;display:flex;gap:6px;align-items:center}
.acct[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.acct .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.acct .dot.w{background:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:.82rem;border-radius:6px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--f-num);font-size:.75rem;background:var(--surface-2);border-radius:999px;padding:1px 7px;margin-left:4px}
.banner{background:var(--idle-bg);color:var(--idle);border-radius:8px;padding:9px 12px;font-size:.88rem}

/* panneaux */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}

/* verdict */
.verdict{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:center;padding:20px;border-radius:12px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--warn)}
.verdict.ok{border-left-color:var(--ok)}
.verdict.idle{border-left-color:var(--idle)}
.verdict h2{font-size:clamp(1.5rem,3.4vw,2.2rem);margin-block:4px}
.meter{width:min(260px,100%);display:flex;flex-direction:column;gap:6px}
.meter .bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;display:flex}
.meter .bar i{display:block;height:100%}
.meter .pct{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1}
@media (max-width:640px){.verdict{grid-template-columns:1fr}}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.12rem;font-weight:500}
.kpi .s{font-size:.8rem;color:var(--muted)}
.kpi.bad .v{color:var(--bad)} .kpi.good .v{color:var(--ok)}

.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}

/* tableaux */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;background:var(--surface-2);padding:7px 10px;white-space:nowrap}
td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
td.lib{min-width:180px;max-width:340px}
tr.sel td{background:var(--accent-soft)}
.neg{color:var(--bad)} .pos{color:var(--ok)}
.sub{display:block;font-size:.78rem;color:var(--muted)}
.acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-ok{background:var(--ok-bg);color:var(--ok)}
.st-warn{background:var(--warn-bg);color:var(--warn)}
.st-bad{background:var(--bad-bg);color:var(--bad)}
.st-idle{background:var(--idle-bg);color:var(--idle)}
.score{display:inline-flex;gap:2px;align-items:center;font-size:.74rem;font-weight:600}
.score b{width:6px;height:12px;border-radius:2px;background:var(--surface-2)}
.score.s3 b{background:var(--ok)} .score.s2 b:nth-child(-n+2){background:var(--warn)} .score.s1 b:first-child{background:var(--bad)}

.group{display:flex;flex-direction:column;gap:6px}
.group-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.empty{padding:14px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);text-align:center}

/* état de rapprochement */
.etat{width:100%;font-size:.9rem}
.etat td{border-top:1px dashed var(--line);padding:6px 4px}
.etat tr.t td{border-top:1.5px solid var(--ink);font-weight:600}

/* formulaires */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.75rem;color:var(--muted);font-weight:600}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
textarea{font-family:var(--f-num);font-size:.8rem;min-height:130px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto}
.check{display:flex;gap:7px;align-items:center;font-size:.88rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;font-size:.84rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.pick{grid-template-columns:1fr}}
.pick .tbl-wrap{max-height:340px;overflow:auto}
.hint{font-size:.82rem;color:var(--muted);max-width:70ch}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:9}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:.4}}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Pointage des comptes</h1><span class="muted" id="modeLbl"></span></div>
    <div class="row">
      <div class="accounts" id="accounts" role="group" aria-label="Compte bancaire"></div>
      <button class="btn primary" data-act="run" id="runBtn">Lancer le rapprochement</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div id="banner"></div>
  <main id="main"><p class="muted">Chargement des données…</p></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- Données d'exemple (marquées exemple:true) ---------- */
const SAMPLE = {
  params:{tolJours:3,tolMontant:0,fenetreFaible:31,autoFort:true,comptes:["ECOBANK","BIIC","BGFI","Atlantique"],soldes:{ECOBANK:8000000}},
  mouv:[
    ["2026-10-01","VIR-2210","Vente","Client SOTRACI · facture F-0921","Ventes",0,4500000],
    ["2026-10-02","CHQ 0045871","Achat pièces","Fournisseur CFAO · BC 331","Achats",1250000,0],
    ["2026-10-03","VIR-2214","Salaires septembre","Lot de virements · 14 agents","Salaires",3800000,0],
    ["2026-10-05","","Transport conteneur","Bolloré · port → entrepôt","Logistique",420000,0],
    ["2026-10-06","CHQ 0045872","Fournitures bureau","Librairie de France","Achats",185000,0],
    ["2026-10-07","ENC-118","Vente","Client KIMA SARL · facture F-0925","Ventes",0,2150000],
    ["2026-10-08","","Versement espèces","Recette caisse semaine 40","Ventes",0,600000],
    ["2026-10-09","CHQ 0045873","Loyer entrepôt","Octobre 2026","Autre",750000,0],
    ["2026-10-10","VIR-2220","Transfert vers BIIC","Alimentation compte BIIC","Transfert",2000000,0],
    ["2026-10-12","ENC-121","Vente","Client SOCIMAT · facture F-0930","Ventes",0,1380000],
    ["2026-10-12","CHQ 0045874","Carburant","Station Total · camion 2","Logistique",310000,0],
    ["2026-10-13","","Vente comptoir","Ticket 4471","Ventes",0,275000]
  ],
  rel:[
    ["2026-10-01","VIR RECU SOTRACI REF VIR-2210","",0,4500000,12500000],
    ["2026-10-02","COMMISSION SUR VIREMENT","",3500,0,12496500],
    ["2026-10-03","VIREMENT SALAIRES LOT 2214","",3800000,0,8696500],
    ["2026-10-04","PAIEMENT CHEQUE","45871",1250000,0,7446500],
    ["2026-10-06","PRLV BOLLORE TRANSPORT","",420000,0,7026500],
    ["2026-10-07","VERSEMENT KIMA SARL","",0,2150000,9176500],
    ["2026-10-08","VERSEMENT ESPECES","",0,600000,9776500],
    ["2026-10-09","PAIEMENT CHEQUE N° 45872","",185000,0,9591500],
    ["2026-10-09","PAIEMENT CHEQUE N° 45873","",750000,0,8841500],
    ["2026-10-10","VIR EMIS VERS BIIC","",2000000,0,6841500],
    ["2026-10-11","FRAIS TENUE DE COMPTE","",15000,0,6826500],
    ["2026-10-11","TAXE TOB SUR FRAIS","",2700,0,6823800],
    ["2026-10-12","VERSEMENT SOCIMAT","",0,1375000,8198800]
  ]
};
const CATS = ["Achats","Ventes","Logistique","Frais bancaires","Salaires","Transfert","Autre"];
const DEFAULT_PARAMS = {tolJours:3,tolMontant:0,fenetreFaible:31,autoFort:true,comptes:["ECOBANK","BIIC","BGFI","Atlantique"],soldes:{}};

/* ---------- Utilitaires ---------- */
const nf = new Intl.NumberFormat("fr-FR",{maximumFractionDigits:2});
const money = n => nf.format(Math.round((+n||0)*100)/100);
const signed = n => (n<0?"−":n>0?"+":"")+money(Math.abs(n));
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dShow = d => d ? d.slice(8,10)+"/"+d.slice(5,7)+"/"+d.slice(0,4) : "";
const dayN = d => Math.round(Date.parse(d+"T00:00:00Z")/864e5);
const net = x => (+x.credit||0)-(+x.debit||0);
const side = x => (+x.debit||0)>0 ? "D" : "C";
const absAmt = x => (+x.debit||0)>0 ? +x.debit : (+x.credit||0);
const gid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today = () => { const t=new Date(); return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); };
const normTxt = s => String(s||"").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Z0-9]/g,"");
const digitGroups = s => (String(s||"").match(/\d{4,}/g)||[]).map(d=>d.replace(/^0+/,""));
const byDate = (a,b) => (a.date<b.date?-1:a.date>b.date?1:(a.ordre||0)-(b.ordre||0));

function parseAmount(v){
  if (typeof v==="number") return v;
  if (v==null) return NaN;
  let s=String(v).trim(); if(!s) return NaN;
  let neg=/^\(.*\)$/.test(s)||/^-/.test(s)||/-$/.test(s);
  s=s.replace(/[\s  ]/g,"").replace(/(FCFA|XAF|XOF|CFA)/ig,"").replace(/[^0-9.,]/g,"");
  if(!/\d/.test(s)) return NaN;
  const lc=s.lastIndexOf(","), ld=s.lastIndexOf(".");
  if(lc>-1&&ld>-1){ const dec=lc>ld?",":"."; const th=dec===","?".":","; s=s.split(th).join("").replace(dec,"."); }
  else if(lc>-1){ s=/^\d{1,3}(,\d{3})+$/.test(s)?s.replace(/,/g,""):s.replace(",","."); }
  else if(ld>-1){ if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,""); }
  const n=parseFloat(s); return isNaN(n)?NaN:(neg?-n:n);
}
const MONTHS={jan:1,fev:2,mar:3,avr:4,apr:4,mai:5,may:5,juin:6,jun:6,juil:7,jul:7,aou:8,aug:8,sep:9,oct:10,nov:11,dec:12};
function parseDate(v){
  const iso=(y,m,d)=>{ y=+y;m=+m;d=+d; if(y<100) y+=2000; if(!(m>=1&&m<=12&&d>=1&&d<=31&&y>1990&&y<2100)) return null; return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0"); };
  if(v instanceof Date && !isNaN(v)) return iso(v.getFullYear(),v.getMonth()+1,v.getDate());
  if(typeof v==="number"){ if(v>20000&&v<80000){ const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5); return iso(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate()); } return null; }
  const s=String(v||"").trim(); let m;
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return iso(m[1],m[2],m[3]);
  if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})\b/))) return iso(m[3],m[2],m[1]);
  if((m=s.match(/^(\d{1,2})[\s-]+([A-Za-zÀ-ÿ]+)\.?[\s-]+(\d{2,4})/))){
    const k=m[2].toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
    const mo=MONTHS[k.slice(0,4)]||MONTHS[k.slice(0,3)]; if(mo) return iso(m[3],mo,m[1]);
  }
  return null;
}

/* ---------- Stockage (db partagé, ou mémoire en mode démo) ---------- */
let DB=null;
const S = {mouv:[],rel:[],paires:[],params:{...DEFAULT_PARAMS},compte:"ECOBANK",tab:"bord",mode:"loading",
  loaded:{mouv:false,rel:false,paires:false},pairFilter:"propose",pickL:null,pickB:null,filtL:"tous",filtB:"tous",q:"",
  editL:null,editB:null,imp:null,impTarget:"rel"};
const MEM = {mouv:new Map,rel:new Map,paires:new Map};
const COL = {mouv:"mouvements",rel:"releve",paires:"paires"};

function memSync(){ for(const k of ["mouv","rel","paires"]) S[k]=[...MEM[k].entries()].map(([id,d])=>({id,...d})); schedule(); }
const store = {
  async put(k,id,data){ if(DB) return DB.collection(COL[k]).doc(id).set(data); MEM[k].set(id,{...data}); memSync(); },
  async patch(k,id,data){ if(DB) return DB.collection(COL[k]).doc(id).update(data); MEM[k].set(id,{...MEM[k].get(id),...data}); memSync(); },
  async del(k,id){ if(DB) return DB.collection(COL[k]).doc(id).delete(); MEM[k].delete(id); memSync(); },
  async params(p){ S.params={...S.params,...p}; if(DB) return DB.doc("config/params").set(S.params); schedule(); },
  async many(ops){ for(let i=0;i<ops.length;i+=20){ await Promise.all(ops.slice(i,i+20).map(o=>o())); } }
};
async function safe(fn,okMsg){
  try{ await fn(); if(okMsg) toast(okMsg); }
  catch(e){ const c=e&&e.code;
    toast(c==="quota_exceeded"?"Stockage plein : supprimez d'anciennes lignes puis réessayez."
      : c==="invalid_argument"?"Enregistrement refusé : vous n'avez que l'accès en lecture à cette page."
      : "Enregistrement impossible pour l'instant. Réessayez dans un instant."); console.error(e); }
}

function loadSampleRows(){
  const base=Date.now(); const out=[];
  SAMPLE.mouv.forEach((r,i)=>out.push(["mouv","ex-l"+(i+1),{date:r[0],ref:r[1],motif:r[2],description:r[3],categorie:r[4],debit:r[5],credit:r[6],compte:"ECOBANK",ordre:base+i,exemple:true}]));
  SAMPLE.rel.forEach((r,i)=>out.push(["rel","ex-b"+(i+1),{date:r[0],libelle:r[1],ref:r[2],debit:r[3],credit:r[4],solde:r[5],compte:"ECOBANK",ordre:base+i,exemple:true}]));
  return out;
}

/* ---------- Statuts dérivés ---------- */
function ctx(){
  const c=S.compte;
  const L=S.mouv.filter(x=>x.compte===c).sort(byDate);
  const B=S.rel.filter(x=>x.compte===c).sort(byDate);
  const P=S.paires.filter(p=>p.compte===c);
  const Lm=new Map(L.map(x=>[x.id,x])), Bm=new Map(B.map(x=>[x.id,x]));
  const lockL=new Map, lockB=new Map, propL=new Map, propB=new Map;
  const live=P.filter(p=>Lm.has(p.localId)&&Bm.has(p.bankId));
  for(const p of live){
    if(p.statut==="auto"||p.statut==="valide"){ lockL.set(p.localId,p); lockB.set(p.bankId,p); }
    else if(p.statut==="propose"){ propL.set(p.localId,p); propB.set(p.bankId,p); }
  }
  const st=(x,isL)=>{ const lk=(isL?lockL:lockB).get(x.id);
    if(lk) return lk.origine==="manuel"?"Manuel":"Rapproché";
    if(x.ecart) return "Écart";
    if((isL?propL:propB).get(x.id)) return "Proposé";
    return "Non rapproché"; };
  const dupKey=x=>x.date+"|"+side(x)+"|"+absAmt(x);
  const dups=arr=>{ const m=new Map; arr.forEach(x=>m.set(dupKey(x),(m.get(dupKey(x))||0)+1)); return new Set(arr.filter(x=>m.get(dupKey(x))>1).map(x=>x.id)); };
  return {c,L,B,P:live,Lm,Bm,lockL,lockB,propL,propB,st,dupL:dups(L),dupB:dups(B)};
}
const STCLS={"Rapproché":"st-ok","Manuel":"st-ok","Proposé":"st-warn","Écart":"st-bad","Non rapproché":"st-idle"};
const chip=s=>`<span class="chip ${STCLS[s]||"st-idle"}">${esc(s)}</span>`;
const SCORE={3:"Fort",2:"Moyen",1:"Faible",0:"Manuel"};
const scoreEl=s=>`<span class="score s${s}" title="Confiance ${SCORE[s]}"><b></b><b></b><b></b>&nbsp;${SCORE[s]}</span>`;

/* ---------- Moteur de rapprochement ---------- */
function refMatch(l,b){
  const lr=normTxt(l.ref); const bt=normTxt(b.ref)+"|"+normTxt(b.libelle);
  if(lr.length>=4&&bt.includes(lr)) return true;
  const lg=digitGroups(l.ref); if(!lg.length) return false;
  const bg=new Set([...digitGroups(b.ref),...digitGroups(b.libelle)]);
  return lg.some(g=>g&&bg.has(g));
}
function evalPair(l,b,p){
  if(side(l)!==side(b)) return null;
  const dm=Math.abs(absAmt(l)-absAmt(b)); if(dm>(+p.tolMontant||0)) return null;
  const dj=Math.abs(dayN(l.date)-dayN(b.date)); const ref=refMatch(l,b);
  let score;
  if(dj<=(+p.tolJours||0)) score=ref?3:2;
  else if(dj<=(+p.fenetreFaible||31)) score=ref?2:1;
  else return null;
  return {score,dj,dm,ref};
}
async function runEngine(){
  const X=ctx(), p=S.params;
  const rejected=new Set(X.P.concat(S.paires.filter(q=>q.compte===X.c)).filter(q=>q.statut==="rejete").map(q=>q.localId+"|"+q.bankId));
  const L=X.L.filter(x=>!x.ecart&&!X.lockL.has(x.id)), B=X.B.filter(x=>!x.ecart&&!X.lockB.has(x.id));
  const cands=[];
  for(const l of L) for(const b of B){ if(rejected.has(l.id+"|"+b.id)) continue; const m=evalPair(l,b,p); if(m) cands.push({l,b,...m}); }
  cands.sort((a,b)=>b.score-a.score||a.dj-b.dj||a.dm-b.dm);
  // ambiguïté : plusieurs candidats au meilleur score pour une même ligne → pas d'auto-validation
  const topL=new Map, topB=new Map;
  for(const c of cands){ topL.set(c.l.id,Math.max(topL.get(c.l.id)||0,c.score)); topB.set(c.b.id,Math.max(topB.get(c.b.id)||0,c.score)); }
  const cntL=new Map, cntB=new Map;
  for(const c of cands){ if(c.score===topL.get(c.l.id)) cntL.set(c.l.id,(cntL.get(c.l.id)||0)+1); if(c.score===topB.get(c.b.id)) cntB.set(c.b.id,(cntB.get(c.b.id)||0)+1); }
  const usedL=new Set, usedB=new Set, chosen=[];
  for(const c of cands){ if(usedL.has(c.l.id)||usedB.has(c.b.id)) continue; usedL.add(c.l.id); usedB.add(c.b.id); chosen.push(c); }
  const ops=[]; const keep=new Set;
  let auto=0, prop=0;
  for(const c of chosen){
    const id=c.l.id+"~"+c.b.id; keep.add(id);
    const ambig=(cntL.get(c.l.id)>1)||(cntB.get(c.b.id)>1);
    const statut=(c.score===3&&p.autoFort&&!ambig)?"auto":"propose";
    statut==="auto"?auto++:prop++;
    ops.push(()=>store.put("paires",id,{compte:X.c,localId:c.l.id,bankId:c.b.id,score:c.score,dj:c.dj,dm:c.dm,ref:c.ref,ambigu:ambig,statut,origine:"auto",at:new Date().toISOString()}));
  }
  for(const q of S.paires.filter(q=>q.compte===X.c&&q.statut==="propose")) if(!keep.has(q.id)) ops.push(()=>store.del("paires",q.id));
  await safe(()=>store.many(ops));
  const restL=L.length-chosen.length, restB=B.length-chosen.length;
  toast(`${X.c} : ${auto} rapprochée${auto>1?"s":""} automatiquement, ${prop} proposition${prop>1?"s":""} à valider, ${restL+restB} ligne${restL+restB>1?"s":""} sans correspondance.`);
  if(prop) { S.tab="bord"; }
  schedule();
}

/* ---------- Soldes ---------- */
function soldes(X,dateArret){
  const ouv=+(S.params.soldes||{})[X.c]||0;
  const Ld=X.L.filter(x=>x.date<=dateArret), Bd=X.B.filter(x=>x.date<=dateArret);
  const local=ouv+Ld.reduce((s,x)=>s+net(x),0);
  const withS=Bd.filter(x=>x.solde!==""&&x.solde!=null&&!isNaN(+x.solde));
  const last=withS.length?withS[withS.length-1]:null;
  const lastIdx=last?Bd.indexOf(last):-1;
  const banque=last? +last.solde + Bd.slice(lastIdx+1).reduce((s,x)=>s+net(x),0) : ouv+Bd.reduce((s,x)=>s+net(x),0);
  const unL=Ld.filter(x=>!X.lockL.has(x.id)), unB=Bd.filter(x=>!X.lockB.has(x.id));
  const lc=unL.reduce((s,x)=>s+(+x.credit||0),0), ld=unL.reduce((s,x)=>s+(+x.debit||0),0);
  const bc=unB.reduce((s,x)=>s+(+x.credit||0),0), bd=unB.reduce((s,x)=>s+(+x.debit||0),0);
  const theo=banque+lc-ld-bc+bd;
  return {ouv,local,banque,ecart:local-banque,lc,ld,bc,bd,theo,residuel:local-theo,fromStatement:!!last};
}

/* ---------- Rendu ---------- */
let raf=0; function schedule(){ if(!raf) raf=requestAnimationFrame(()=>{raf=0;render();}); }
let tt=0; function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,4200); }

function comptes(){ const s=new Set(S.params.comptes||[]); S.mouv.forEach(x=>x.compte&&s.add(x.compte)); S.rel.forEach(x=>x.compte&&s.add(x.compte)); return [...s]; }

function render(){
  const cs=comptes(); if(!cs.includes(S.compte)&&cs.length) S.compte=cs[0];
  const X=ctx();
  // comptes
  document.getElementById("accounts").innerHTML=cs.map(c=>{
    const hasData=S.mouv.some(x=>x.compte===c)||S.rel.some(x=>x.compte===c);
    let todo=0; if(hasData){ const XX=c===X.c?X:(()=>{const o=S.compte;S.compte=c;const r=ctx();S.compte=o;return r;})(); todo=XX.L.filter(x=>!XX.lockL.has(x.id)).length+XX.B.filter(x=>!XX.lockB.has(x.id)).length; }
    return `<button class="acct" data-act="compte" data-v="${esc(c)}" aria-pressed="${c===S.compte}">${hasData?`<span class="dot ${todo?"w":""}"></span>`:""}${esc(c)}</button>`;
  }).join("");
  const nProp=X.P.filter(p=>p.statut==="propose").length;
  const tabs=[["bord","Synthèse",""],["rap","Rapprochement",nProp||""],["loc","Mouvements locaux",X.L.length],["ban","Relevé banque",X.B.length],["imp","Importer",""],["par","Paramètres",""]];
  document.getElementById("tabs").innerHTML=tabs.map(([k,l,n])=>`<button class="tab" role="tab" data-act="tab" data-v="${k}" aria-selected="${S.tab===k}">${l}${n!==""?`<span class="cnt">${n}</span>`:""}</button>`).join("");
  document.getElementById("modeLbl").textContent="";
  document.getElementById("banner").innerHTML=S.mode==="demo"?`<div class="banner">Mode démonstration : ces données d'exemple ne sont pas enregistrées. Ouvrez la page connecté à votre compte Claude pour conserver vos opérations.</div>`:"";
  document.getElementById("runBtn").disabled=S.mode==="loading";
  const main=document.getElementById("main");
  if(S.mode==="loading"){ main.innerHTML=`<p class="muted">Chargement des données…</p>`; return; }
  const fn={bord:vBord,rap:vRap,loc:vLoc,ban:vBan,imp:vImp,par:vPar}[S.tab];
  const ae=document.activeElement, aid=ae&&ae.id, sel=aid&&ae.selectionStart;

  if(aid){ const el=document.getElementById(aid); if(el){ el.focus(); try{ if(sel!=null) el.setSelectionRange(sel,sel);}catch(e){} } }
}

function lineDesc(x,isL){ return isL ? `${esc(x.motif||"—")}<span class="sub">${esc([x.ref,x.description].filter(Boolean).join(" · "))}</span>` : `${esc(x.libelle||"—")}${x.ref?`<span class="sub">Réf. ${esc(x.ref)}</span>`:""}`; }
function amtCell(x){ const n=net(x); return `<td class="r num ${n<0?"neg":"pos"}">${signed(n)}</td>`; }

function vBord(X){
  if(!X.L.length&&!X.B.length) return emptyAccount(X);
  const arret=S.arret||(X.B.length?X.B[X.B.length-1].date:(X.L.length?X.L[X.L.length-1].date:today()));
  const so=soldes(X,arret);
  const props=X.P.filter(p=>p.statut==="propose").sort((a,b)=>b.score-a.score);
  const unL=X.L.filter(x=>!X.lockL.has(x.id)&&!X.propL.has(x.id)&&!x.ecart);
  const unB=X.B.filter(x=>!X.lockB.has(x.id)&&!X.propB.has(x.id)&&!x.ecart);
  const ecL=X.L.filter(x=>x.ecart&&!X.lockL.has(x.id)), ecB=X.B.filter(x=>x.ecart&&!X.lockB.has(x.id));
  const total=X.L.length+X.B.length, done=X.lockL.size+X.lockB.size;
  const pct=total?Math.round(done/total*100):0;
  const stuck=props.length+unL.length+unB.length+ecL.length+ecB.length;
  const never=!X.P.length;
  const cls=stuck===0?"ok":never?"idle":"";
  const head=stuck===0?"Tout est rapproché":never?`${total} lignes à pointer`:`${stuck} ligne${stuck>1?"s":""} qui coince${stuck>1?"nt":""}`;
  const sub=stuck===0?`Les ${X.L.length} opérations locales et les ${X.B.length} lignes du relevé se correspondent.`
    : never?`Aucun rapprochement lancé sur ce compte. Lancez-le pour pointer automatiquement montant + date ± ${S.params.tolJours} j.`
    : [props.length&&`${props.length} proposition${props.length>1?"s":""} à valider`, unL.length&&`${unL.length} dans vos comptes sans trace en banque`, unB.length&&`${unB.length} sur le relevé sans écriture locale`, (ecL.length+ecB.length)&&`${ecL.length+ecB.length} écart${ecL.length+ecB.length>1?"s":""} signalé${ecL.length+ecB.length>1?"s":""}`].filter(Boolean).join(" · ");
  const sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
  const pr=X.P.filter(p=>p.statut==="propose").length;
  const ecartOk=Math.abs(so.ecart)<0.005;

  const rowLB=(x,isL)=>`<tr><td class="num">${dShow(x.date)}</td><td class="lib">${lineDesc(x,isL)}${(isL?X.dupL:X.dupB).has(x.id)?` <span class="chip st-warn">Doublon possible</span>`:""}${x.ecart&&x.note?`<span class="sub">Note : ${esc(x.note)}</span>`:""}</td>${amtCell(x)}<td><div class="acts">${x.ecart?`<button class="btn sm" data-act="unecart" data-k="${isL?"mouv":"rel"}" data-id="${x.id}">Retirer l'écart</button>`:`<button class="btn sm" data-act="ecart" data-k="${isL?"mouv":"rel"}" data-id="${x.id}">Marquer écart</button>`}<button class="btn sm ghost" data-act="assoc" data-k="${isL?"L":"B"}" data-id="${x.id}">Associer…</button></div></td></tr>`;
  const tbl=(rows,empty)=>rows.length?`<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Libellé</th><th class="r">Montant</th><th class="r">Actions</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`:`<div class="empty">${empty}</div>`;

  return `
  <section class="verdict ${cls}">
    <div><p class="eyebrow">${esc(X.c)} · arrêté au ${dShow(arret)}</p><h2>${head}</h2><p class="muted" style="margin:0">${sub}</p></div>
    <div class="meter"><span class="pct">${pct}&nbsp;%</span><div class="bar" aria-hidden="true"><i style="width:${pct}%;background:var(--ok)"></i></div><span class="muted" style="font-size:.82rem">${done} / ${total} lignes pointées (local + relevé)</span>
    ${never||props.length||unL.length||unB.length?`<button class="btn primary" data-act="run" style="margin-top:6px">Lancer le rapprochement</button>`:""}</div>
  </section>
  <div class="kpis">
    <div class="kpi"><span class="eyebrow">Local · débits / crédits</span><span class="v">${money(sum(X.L,"debit"))}</span><span class="s">crédits ${money(sum(X.L,"credit"))}</span></div>
    <div class="kpi"><span class="eyebrow">Relevé · débits / crédits</span><span class="v">${money(sum(X.B,"debit"))}</span><span class="s">crédits ${money(sum(X.B,"credit"))}</span></div>
    <div class="kpi"><span class="eyebrow">Solde local au ${dShow(arret)}</span><span class="v">${money(so.local)}</span><span class="s">ouverture ${money(so.ouv)}</span></div>
    <div class="kpi"><span class="eyebrow">Solde relevé au ${dShow(arret)}</span><span class="v">${money(so.banque)}</span><span class="s">${so.fromStatement?"lu sur le relevé":"calculé (pas de colonne solde)"}</span></div>
    <div class="kpi ${ecartOk?"good":"bad"}"><span class="eyebrow">Écart de solde</span><span class="v">${signed(so.ecart)}</span><span class="s">local − relevé, en FCFA</span></div>
  </div>
  <div class="grid2">
    <section class="panel">
      <div class="panel-h"><h2>Lignes qui coincent</h2><span class="muted">${stuck} au total</span></div>
      <div class="group"><div class="group-h"><h3>Propositions à valider</h3><span class="muted">${pr}</span></div>
        ${props.length?`<div class="tbl-wrap"><table><thead><tr><th>Confiance</th><th>Local</th><th>Relevé</th><th class="r">Montant</th><th class="r">Actions</th></tr></thead><tbody>${props.map(p=>pairRow(X,p,true)).join("")}</tbody></table></div>`:`<div class="empty">Aucune proposition en attente.</div>`}
      </div>
      <div class="group"><div class="group-h"><h3>Dans mes comptes, absentes du relevé</h3><span class="muted">${unL.length}</span></div>
        ${tbl(unL.map(x=>rowLB(x,true)),"Toutes vos opérations ont une contrepartie.")}
        ${unL.length?`<p class="hint">Souvent des chèques émis non encore encaissés ou des remises en cours.</p>`:""}</div>
      <div class="group"><div class="group-h"><h3>Sur le relevé, absentes de mes comptes</h3><span class="muted">${unB.length}</span></div>
        ${tbl(unB.map(x=>rowLB(x,false)),"Toutes les lignes du relevé sont enregistrées.")}
        ${unB.some(x=>/FRAIS|COMMISSION|TAXE|TOB|AGIOS|TVA/i.test(x.libelle))?`<p class="hint">Les frais et commissions bancaires se règlent en un clic : <button class="btn sm" data-act="frais">Créer les écritures de frais bancaires</button></p>`:""}</div>
      ${ecL.length+ecB.length?`<div class="group"><div class="group-h"><h3>Écarts signalés</h3><span class="muted">${ecL.length+ecB.length}</span></div>${tbl(ecL.map(x=>rowLB(x,true)).concat(ecB.map(x=>rowLB(x,false))),"")}</div>`:""}
    </section>
    <section class="panel">
      <div class="panel-h"><h2>État de rapprochement</h2></div>
      <div class="field"><label for="arret">Date d'arrêté</label><input type="date" id="arret" value="${arret}" data-act="arret"></div>
      <table class="etat">
        <tr><td>Solde du relevé</td><td class="r num">${money(so.banque)}</td></tr>
        <tr><td>+ crédits locaux non pointés</td><td class="r num">${money(so.lc)}</td></tr>
        <tr><td>− débits locaux non pointés</td><td class="r num">${money(so.ld)}</td></tr>
        <tr><td>− crédits banque non pointés</td><td class="r num">${money(so.bc)}</td></tr>

        <tr class="t"><td>Écart inexpliqué</td><td class="r num ${Math.abs(so.residuel)<0.005?"pos":"neg"}">${signed(so.residuel)}</td></tr>
      </table>
      <p class="hint">${Math.abs(so.residuel)<0.005?"L'écart de solde s'explique entièrement par les lignes non pointées listées à gauche.":"Un écart inexpliqué signale en général un solde d'ouverture faux (Paramètres) ou un relevé incomplet."}</p>
      <div class="group"><h3>Paramètres du moteur</h3>
        <p class="hint" style="margin:0">Date ± ${S.params.tolJours} j · montant ± ${money(S.params.tolMontant)} FCFA · Fort validé ${S.params.autoFort?"automatiquement":"à la main"}. <button class="btn sm ghost" data-act="tab" data-v="rap">Modifier</button></p></div>
    </section>
  </div>`;
}

  return `<tr><td>${scoreEl(p.score)}<span class="sub">${esc(det)}</span>${withActs?"":`<span class="sub">${chip(st)}</span>`}</td>

function vRap(X){
  const p=S.params;
  const list=X.P.filter(q=>S.pairFilter==="tous"?q.statut!=="rejete":S.pairFilter==="ok"?(q.statut==="auto"||q.statut==="valide"):q.statut==="propose").sort((a,b)=>b.score-a.score);
  const nP=X.P.filter(q=>q.statut==="propose").length, nOk=X.P.filter(q=>q.statut==="auto"||q.statut==="valide").length;
  const fL=X.L.filter(x=>!X.lockL.has(x.id)), fB=X.B.filter(x=>!X.lockB.has(x.id));
  const pl=S.pickL&&X.Lm.get(S.pickL), pb=S.pickB&&X.Bm.get(S.pickB);
  const diff=pl&&pb?net(pl)-net(pb):null;
  const pickTbl=(arr,isL)=>arr.length?`<div class="tbl-wrap"><table><tbody>${arr.map(x=>{const on=(isL?S.pickL:S.pickB)===x.id;return `<tr class="${on?"sel":""}"><td><input type="radio" name="pk${isL?"L":"B"}" id="pk-${x.id}" data-act="pick" data-k="${isL?"L":"B"}" data-id="${x.id}" ${on?"checked":""} aria-label="Choisir"></td><td class="num">${dShow(x.date)}</td><td class="lib"><label for="pk-${x.id}">${lineDesc(x,isL)}</label></td>${amtCell(x)}</tr>`}).join("")}</tbody></table></div>`:`<div class="empty">Rien à associer.</div>`;
  return `
  <section class="panel">
    <div class="panel-h"><h2>Réglages du moteur · ${esc(X.c)}</h2><button class="btn primary" data-act="run">Lancer le rapprochement</button></div>
    <div class="form">
      <div class="field"><label for="tolJours">Tolérance de date (jours)</label><select id="tolJours" data-act="param" data-k="tolJours">${[0,1,2,3,4,5,7].map(n=>`<option value="${n}" ${+p.tolJours===n?"selected":""}>± ${n} j</option>`).join("")}</select></div>
      <div class="field"><label for="tolMontant">Tolérance de montant (FCFA)</label><input id="tolMontant" type="number" min="0" step="1" value="${+p.tolMontant||0}" data-act="param" data-k="tolMontant"></div>
      <div class="field"><label for="fenetreFaible">Fenêtre « Faible » (jours)</label><input id="fenetreFaible" type="number" min="0" step="1" value="${+p.fenetreFaible||31}" data-act="param" data-k="fenetreFaible"></div>

    <p class="hint"><b>Fort</b> : même montant, date dans la tolérance et référence retrouvée (n° chèque, réf. virement). <b>Moyen</b> : montant et date. <b>Faible</b> : montant seul, à vérifier. Une ligne qui a plusieurs candidats de même niveau reste en proposition.</p>
  </section>
  <section class="panel">

const FIELDS={
  rel:[["date","Date"],["libelle","Libellé"],["ref","Référence"],["debit","Débit"],["credit","Crédit"],["montant","Montant signé (±)"],["solde","Solde"]],
  mouv:[["date","Date"],["ref","Référence"],["motif","Motif"],["description","Description"],["categorie","Catégorie"],["debit","Débit"],["credit","Crédit"],["montant","Montant signé (±)"]]
};
const KEYS={date:/date|valeur|jour/i,libelle:/libell|descr|d[ée]signation|narrat|d[ée]tail|op[ée]ration|motif/i,ref:/r[ée]f|ch[èe]que|pi[èe]ce|n°|num/i,
  debit:/d[ée]bit|retrait|sortie/i,credit:/cr[ée]dit|versement|d[ée]p[ôo]t|entr[ée]e/i,montant:/montant|amount|somme/i,solde:/solde|balance/i,
  motif:/motif|objet|libell/i,description:/descr|d[ée]tail|b[ée]n[ée]f/i,categorie:/cat[ée]g/i};
function splitLine(l,d){
  if(d==="  ") return l.trim().split(/\s{2,}/);
  const out=[]; let cur="",q=false;
  for(let i=0;i<l.length;i++){ const c=l[i];
    if(c==='"'){ if(q&&l[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if(c===d&&!q){ out.push(cur); cur=""; } else cur+=c; }
  out.push(cur); return out.map(s=>s.trim());
}
function parseText(text){
  const lines=text.replace(/\r/g,"").split("\n").filter(l=>l.trim());
  const sample=lines.slice(0,12).join("\n");
  const d=sample.includes("\t")?"\t":sample.includes(";")?";":sample.includes(",")?",":"  ";
  return lines.map(l=>splitLine(l,d));
}
function analyse(rows,target){
  rows=rows.filter(r=>r&&r.some(c=>String(c??"").trim()!==""));
  let hi=-1;
  for(let i=0;i<Math.min(15,rows.length);i++){ const hits=rows[i].filter(c=>typeof c==="string"&&Object.values(KEYS).some(k=>k.test(c))&&!parseDate(c)).length; if(hits>=2){hi=i;break;} }
  const width=Math.max(...rows.map(r=>r.length));
  const heads=Array.from({length:width},(_,i)=>hi>=0&&String(rows[hi][i]??"").trim()?String(rows[hi][i]).trim():"Colonne "+(i+1));
  const map={}; const used=new Set;
  for(const [f] of FIELDS[target]){ const idx=heads.findIndex((h,i)=>!used.has(i)&&hi>=0&&KEYS[f].test(h)); if(idx>-1){map[f]=idx;used.add(idx);} }
  if(map.montant!=null&&(map.debit!=null||map.credit!=null)) delete map.montant;
  if(hi<0){ // sans en-têtes : deviner la date et les montants
    const r=rows[0]||[]; const di=r.findIndex(c=>parseDate(c)); if(di>-1) map.date=di;
  }
  return {rows:rows.slice(hi+1),heads,map,target};
}
function convert(imp){
  const m=imp.map, g=(r,f)=>m[f]!=null?r[m[f]]:"";
  const out=[]; let skipped=0;
  for(const r of imp.rows){
    const date=parseDate(g(r,"date")); if(!date){skipped++;continue;}
    let debit=0,credit=0;
    if(m.montant!=null){ const v=parseAmount(g(r,"montant")); if(isNaN(v)||!v){skipped++;continue;} v<0?debit=-v:credit=v; }
    else { const d=parseAmount(g(r,"debit")), c=parseAmount(g(r,"credit")); debit=isNaN(d)?0:Math.abs(d); credit=isNaN(c)?0:Math.abs(c); if(!debit&&!credit){skipped++;continue;} if(debit&&credit){ const n=credit-debit; debit=n<0?-n:0; credit=n>0?n:0; } }
    const o={date,debit,credit,ref:String(g(r,"ref")??"").trim()};
    if(imp.target==="rel"){ o.libelle=String(g(r,"libelle")??"").trim(); const s=parseAmount(g(r,"solde")); o.solde=isNaN(s)?"":s; }
    else { o.motif=String(g(r,"motif")??"").trim(); o.description=String(g(r,"description")??"").trim(); const c=String(g(r,"categorie")??"").trim(); o.categorie=CATS.find(k=>k.toLowerCase()===c.toLowerCase())||(c?"Autre":"Autre"); if(!o.motif) o.motif=o.description||"—"; }
    out.push(o);
  }
  return {out,skipped};
}
const dedupKey=(x,t)=>[x.compte,x.date,+x.debit||0,+x.credit||0,normTxt(t==="rel"?x.libelle:(x.motif+x.ref))].join("|");

    <div class="form" style="grid-template-columns:minmax(0,1fr)">
      <div class="field"><label for="impFile">Fichier Excel (.xlsx, .xls) ou CSV</label><input id="impFile" type="file" accept=".xlsx,.xls,.csv,.txt,.tsv" data-act="file"></div>
      <div class="field"><label for="impText">Ou collez les lignes (depuis Excel, un CSV ou un PDF)</label><textarea id="impText" placeholder="Date;Libellé;Débit;Crédit;Solde&#10;04/10/2026;PAIEMENT CHEQUE 45871;1 250 000;;7 446 500"></textarea></div>
    </div>
    <div class="row"><button class="btn primary" data-act="parse">Analyser le texte collé</button><span class="hint">Relevé PDF : sélectionnez le tableau dans le PDF, copiez, collez ici. Les colonnes séparées par plusieurs espaces sont reconnues.</span></div>
  </section>${preview}`;
}

const armed=new Map;
function arm(btn,key,label){ if(armed.get(key)&&Date.now()-armed.get(key)<4000){ armed.delete(key); return true; } armed.set(key,Date.now()); btn.textContent=label||"Confirmer ?"; btn.classList.add("armed"); setTimeout(()=>{ if(armed.has(key)){armed.delete(key); schedule();} },4000); return false; }

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]"); if(!t||t.tagName==="INPUT"||t.tagName==="SELECT") return;
  const a=t.dataset.act, id=t.dataset.id, v=t.dataset.v, k=t.dataset.k;
  const X=ctx();
  if(a==="tab"){ S.tab=v; S.q=""; schedule(); window.scrollTo({top:0}); }
  else if(a==="compte"){ S.compte=v; S.pickL=S.pickB=null; S.arret=null; S.imp=null; schedule(); }
  else if(a==="run"){ t.disabled=true; await runEngine(); }
  else if(a==="valid"){ await safe(()=>store.patch("paires",id,{statut:"valide"}),"Paire validée."); }
  else if(a==="validAll"){ const ps=X.P.filter(p=>p.statut==="propose"&&p.score>=+v); await safe(()=>store.many(ps.map(p=>()=>store.patch("paires",p.id,{statut:"valide"}))),`${ps.length} paire${ps.length>1?"s":""} validée${ps.length>1?"s":""}.`); }
  else if(a==="reject"){ await safe(()=>store.patch("paires",id,{statut:"rejete"}),"Proposition rejetée : elle ne sera plus proposée."); }
  else if(a==="undo"){ await safe(()=>store.del("paires",id),"Pointage annulé."); }
  else if(a==="ecart"){ await safe(()=>store.patch(k,id,{ecart:true}),"Ligne marquée en écart."); }
  else if(a==="unecart"){ await safe(()=>store.patch(k,id,{ecart:false,note:""}),"Écart retiré."); }
  else if(a==="assoc"){ S.tab="rap"; if(k==="L") S.pickL=id; else S.pickB=id; schedule(); requestAnimationFrame(()=>requestAnimationFrame(()=>document.getElementById("manuel")?.scrollIntoView({behavior:"smooth"}))); }
  else if(a==="manual"){
    const l=X.Lm.get(S.pickL), b=X.Bm.get(S.pickB); if(!l||!b) return;
    const pid=l.id+"~"+b.id; const ops=[];
    for(const q of X.P.filter(q=>(q.localId===l.id||q.bankId===b.id)&&q.statut==="propose")) ops.push(()=>store.del("paires",q.id));
    const dj=Math.abs(dayN(l.date)-dayN(b.date)), dm=Math.abs(absAmt(l)-absAmt(b));
    ops.push(()=>store.put("paires",pid,{compte:X.c,localId:l.id,bankId:b.id,score:0,dj,dm,ref:refMatch(l,b),statut:"valide",origine:"manuel",at:new Date().toISOString()}));
    S.pickL=S.pickB=null; await safe(()=>store.many(ops),"Association manuelle enregistrée.");
  }
  else if(a==="pf"){ S.pairFilter=v; schedule(); }
  else if(a==="editL"){ S.editL=id; schedule(); window.scrollTo({top:0,behavior:"smooth"}); }
  else if(a==="editB"){ S.editB=id; schedule(); window.scrollTo({top:0,behavior:"smooth"}); }
  else if(a==="cancelL"){ S.editL=null; schedule(); } else if(a==="cancelB"){ S.editB=null; schedule(); }
  else if(a==="delLine"){ if(!arm(t,"del"+id)) return; const pk=k==="mouv"?"localId":"bankId"; const ops=S.paires.filter(p=>p[pk]===id).map(p=>()=>store.del("paires",p.id)); ops.push(()=>store.del(k,id)); await safe(()=>store.many(ops),"Ligne supprimée."); }
  else if(a==="frais"){
    const fr=X.B.filter(x=>!X.lockB.has(x.id)&&!x.ecart&&/FRAIS|COMMISSION|TAXE|TOB|AGIOS|TVA/i.test(x.libelle)); const base=Date.now(); const ops=[];
    fr.forEach((b,i)=>{ const lid=gid()+i; ops.push(()=>store.put("mouv",lid,{date:b.date,ref:b.ref||"",motif:"Frais bancaires",description:b.libelle,categorie:"Frais bancaires",debit:+b.debit||0,credit:+b.credit||0,compte:X.c,ordre:base+i}));
      ops.push(()=>store.put("paires",lid+"~"+b.id,{compte:X.c,localId:lid,bankId:b.id,score:3,dj:0,dm:0,ref:true,statut:"valide",origine:"auto",at:new Date().toISOString()})); });
    await safe(()=>store.many(ops),`${fr.length} écriture${fr.length>1?"s":""} de frais créée${fr.length>1?"s":""} et pointée${fr.length>1?"s":""}.`);
  }
  else if(a==="sample"){ const rows=loadSampleRows(); await safe(async()=>{ await store.many(rows.map(([k2,i2,d])=>()=>store.put(k2,i2,d))); await store.params({soldes:{...(S.params.soldes||{}),ECOBANK:8000000}}); },"Exemple ECOBANK chargé."); }
  else if(a==="clearEx"){ if(!arm(t,"clearEx","Confirmer l'effacement")) return;
    const exL=new Set(S.mouv.filter(x=>x.exemple).map(x=>x.id)), exB=new Set(S.rel.filter(x=>x.exemple).map(x=>x.id));
    const ops=[...S.paires.filter(p=>exL.has(p.localId)||exB.has(p.bankId)).map(p=>()=>store.del("paires",p.id)),...[...exL].map(i=>()=>store.del("mouv",i)),...[...exB].map(i=>()=>store.del("rel",i))];
    await safe(()=>store.many(ops),"Données d'exemple effacées."); }
  else if(a==="rmCompte"){ await store.params({comptes:(S.params.comptes||[]).filter(c=>c!==v)}); }
  else if(a==="impT"){ S.impTarget=v; if(S.imp) S.imp=analyse(S.imp.raw,v), S.imp.raw=S.impRaw; schedule(); }
  else if(a==="parse"){ const txt=document.getElementById("impText").value; if(!txt.trim()){toast("Collez d'abord des lignes de relevé.");return;} S.impRaw=parseText(txt); S.imp=analyse(S.impRaw,S.impTarget); S.imp.raw=S.impRaw; schedule(); }
  else if(a==="impReset"){ S.imp=null; schedule(); }
  else if(a==="doImport"){
    const imp=S.imp; const {out}=convert(imp); const kcol=imp.target;
    const ex=new Set((kcol==="rel"?S.rel:S.mouv).filter(x=>x.compte===X.c).map(x=>dedupKey(x,kcol)));
    const fresh=out.filter(o=>!ex.has(dedupKey({...o,compte:X.c},kcol))); const base=Date.now();
    t.disabled=true;
    await safe(()=>store.many(fresh.map((o,i)=>()=>store.put(kcol,gid()+i,{...o,compte:X.c,ordre:base+i}))),`${fresh.length} ligne${fresh.length>1?"s":""} importée${fresh.length>1?"s":""} dans ${X.c}.`);
    S.imp=null; S.tab=kcol==="rel"?"ban":"loc"; schedule();
  }
});

document.addEventListener("change",async e=>{
  const t=e.target, a=t.dataset.act; if(!a) return;
  if(a==="param"){ const val=t.type==="checkbox"?t.checked:Math.max(0,+t.value||0); await safe(()=>store.params({[t.dataset.k]:val})); }
  else if(a==="filt"){ S[t.dataset.k]=t.value; schedule(); }
  else if(a==="arret"){ S.arret=t.value||null; schedule(); }
  else if(a==="pick"){ if(t.dataset.k==="L") S.pickL=t.dataset.id; else S.pickB=t.dataset.id; schedule(); }
  else if(a==="map"){ S.imp.map[t.dataset.k]=t.value===""?null:+t.value; schedule(); }
  else if(a==="ouv"){ const n=parseAmount(t.value); await safe(()=>store.params({soldes:{...(S.params.soldes||{}),[t.dataset.v]:isNaN(n)?0:n}}),"Solde d'ouverture enregistré."); }
  else if(a==="file"){
    const f=t.files&&t.files[0]; if(!f) return;
    try{
      let rows;
      if(/\.xlsx?$/i.test(f.name)){
        if(!window.XLSX){ toast("Lecture Excel indisponible : enregistrez le fichier en CSV ou collez les lignes."); return; }
        const wb=XLSX.read(await f.arrayBuffer(),{type:"array",cellDates:true});
        rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""});
      } else rows=parseText(await f.text());
      S.impRaw=rows; S.imp=analyse(rows,S.impTarget); S.imp.raw=rows; schedule();
    }catch(err){ toast("Fichier illisible. Essayez de l'enregistrer en CSV ou de coller les lignes."); console.error(err); }
  }
});
let qT=0;
document.addEventListener("input",e=>{ if(e.target.dataset.act==="q"){ clearTimeout(qT); const v=e.target.value; qT=setTimeout(()=>{S.q=v;schedule();},200);} });

document.addEventListener("submit",async e=>{
  const f=e.target; if(!f.dataset.form) return; e.preventDefault();
  const fd=Object.fromEntries(new FormData(f).entries());
  if(f.dataset.form==="compte"){ const n=fd.nom.trim(); if(!n) return; if(!comptes().includes(n)) await safe(()=>store.params({comptes:[...(S.params.comptes||[]),n]}),`Compte ${n} ajouté.`); S.compte=n; schedule(); return; }
  const d=parseAmount(fd.debit), c=parseAmount(fd.credit);
  const debit=isNaN(d)?0:Math.abs(d), credit=isNaN(c)?0:Math.abs(c);
  if(!debit&&!credit){ toast("Saisissez un montant au débit ou au crédit."); return; }
  if(debit&&credit){ toast("Une opération est soit un débit, soit un crédit : videz l'un des deux montants."); return; }
  if(f.dataset.form==="L"){
    const prev=S.editL?S.mouv.find(x=>x.id===S.editL):null; const id=prev?prev.id:gid();
    const data={...(prev||{}),date:fd.date,ref:fd.ref.trim(),motif:fd.motif.trim(),description:fd.description.trim(),categorie:fd.categorie,debit,credit,compte:prev?prev.compte:S.compte,ordre:prev?prev.ordre:Date.now()}; delete data.id;
    await safe(()=>store.put("mouv",id,data),prev?"Opération modifiée.":"Opération ajoutée."); S.editL=null;
  } else {
    const prev=S.editB?S.rel.find(x=>x.id===S.editB):null; const id=prev?prev.id:gid(); const so=parseAmount(fd.solde);
    const data={...(prev||{}),date:fd.date,libelle:fd.libelle.trim(),ref:fd.ref.trim(),debit,credit,solde:isNaN(so)?"":so,compte:prev?prev.compte:S.compte,ordre:prev?prev.ordre:Date.now()}; delete data.id;
    await safe(()=>store.put("rel",id,data),prev?"Ligne modifiée.":"Ligne ajoutée."); S.editB=null;
  }
  schedule();
});

/* ---------- Démarrage ---------- */
function startDemo(){
  S.mode="demo"; S.params={...DEFAULT_PARAMS,...SAMPLE.params};
  for(const [k,id,d] of loadSampleRows()) MEM[k].set(id,d);
  memSync();
}
(async()=>{
  render();
  let db=null;
  try{ db=window.claude&&window.claude.use?await window.claude.use("db"):null; }catch(e){ db=null; }
  if(!db){ startDemo(); return; }
  DB=db; S.mode="live";
  const onErr=e=>{ console.error(e); if(e&&e.code==="revoked"){ toast("L'accès aux données a été retiré pour cette page."); } };
  db.collection("mouvements").onSnapshot(s=>{S.mouv=s.docs.map(d=>({id:d.id,...d.data()}));schedule();},onErr);
  db.collection("releve").onSnapshot(s=>{S.rel=s.docs.map(d=>({id:d.id,...d.data()}));schedule();},onErr);
  db.collection("paires").onSnapshot(s=>{S.paires=s.docs.map(d=>({id:d.id,...d.data()}));schedule();},onErr);
  db.doc("config/params").onSnapshot(s=>{ if(s.exists) S.params={...DEFAULT_PARAMS,...s.data()}; schedule(); },onErr);
  schedule();
})();
</script>
